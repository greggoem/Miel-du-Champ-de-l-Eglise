<script>
const KEY_CFG='miel:config', KEY_CNT='miel:compteur', PFX='miel:cmd:';
// Dans un artefact Claude, window.storage existe et sert de stockage.
// Ailleurs, la page parle à Supabase. Les trois valeurs ci-dessous sont à remplir.
// Cette clé est publique par conception : ce sont les règles SQL du projet qui
// protègent les données, pas le secret de la clé.
const SB = {
  url:   'https://omkguzdztjnmpfsnybvt.supabase.co',
  cle:   'sb_publishable_wwfoSgy694paXq4mgQD7_A_g3OeBF8a',
  email: 'greg@goemaere.com'   // compte producteur créé dans Supabase
};

let jeton = '';                      // jeton de session, obtenu à la connexion
let dernierEchec = '';               // cause du dernier refus, affichée à l'écran
const TABLE = '/rest/v1/miel_kv';

function entetes(avecCorps){
  // Supabase attend les deux en-têtes. Sans connexion, la clé publique tient
  // lieu de jeton et donne le rôle « anon » ; connecté, c'est le jeton de session.
  const h = {
    apikey: SB.cle,
    Authorization: 'Bearer ' + (jeton || SB.cle)
  };
  if(avecCorps) h['Content-Type'] = 'application/json';
  return h;
}

async function verifier_reponse(r, quoi){
  if(r.ok) return;
  let detail = '';
  try{ detail = (await r.text()).slice(0,300); }catch(e){}
  throw new Error(quoi + ' — HTTP ' + r.status + (detail ? ' · ' + detail : ''));
}

const distant = {
  async get(k){
    const r = await fetch(`${SB.url}${TABLE}?cle=eq.${encodeURIComponent(k)}&select=valeur`, {headers: entetes()});
    await verifier_reponse(r, 'lecture');
    const d = await r.json();
    return d.length ? {key:k, value:d[0].valeur} : null;
  },
  async set(k, v){
    // Un visiteur ne dispose que du droit d'insertion : pour une nouvelle commande
    // on fait un INSERT simple. L'upsert est réservé aux clés qu'il peut mettre à jour.
    const upsert = !!jeton || k === 'miel:compteur' || k === 'miel:config';
    const r = await fetch(`${SB.url}${TABLE}`, {
      method: 'POST',
      headers: Object.assign(entetes(true),
        {Prefer: (upsert ? 'resolution=merge-duplicates,' : '') + 'return=minimal'}),
      body: JSON.stringify([{cle:k, valeur:v, maj:new Date().toISOString()}])
    });
    await verifier_reponse(r, 'ecriture');
    return {key:k, value:v};
  },
  async list(p){
    const r = await fetch(`${SB.url}${TABLE}?cle=like.${encodeURIComponent((p||'') + '%')}&select=cle&order=cle`, {headers: entetes()});
    await verifier_reponse(r, 'liste');
    return {keys: (await r.json()).map(x => x.cle)};
  },
  async delete(k){
    const r = await fetch(`${SB.url}${TABLE}?cle=eq.${encodeURIComponent(k)}`, {method:'DELETE', headers: entetes()});
    await verifier_reponse(r, 'suppression');
    return {key:k, deleted:true};
  },
  async connexion(motDePasse, adresse){
    try{
      const mail = adresse || SB.email;
      const r = await fetch(`${SB.url}/auth/v1/token?grant_type=password`, {
        method:'POST', headers:{apikey:SB.cle, 'Content-Type':'application/json'},
        body: JSON.stringify({email: mail, password:motDePasse})
      });
      if(!r.ok){
        let t = ''; try{ t = (await r.text()).slice(0,300); }catch(e){}
        dernierEchec = 'connexion ' + mail + ' — HTTP ' + r.status + (t ? ' · ' + t : '');
        console.error(dernierEchec);
        return false;
      }
      const d = await r.json();
      if(!d.access_token){ dernierEchec = "réponse sans jeton d'accès"; return false; }
      jeton = d.access_token;
      if(d.refresh_token) memoire('miel:session', d.refresh_token);
      return true;
    }catch(e){
      dernierEchec = 'réseau : ' + (e && e.message ? e.message : String(e));
      return false;
    }
  }
};

// Le mot de passe n'est jamais conservé : on garde seulement le jeton de session
// délivré par Supabase, valable sur cet appareil et révocable à tout moment.
function memoire(cle, val){
  try{
    if(val === null) localStorage.removeItem(cle);
    else if(val === undefined) return localStorage.getItem(cle) || '';   // lecture
    else localStorage.setItem(cle, val);
  }catch(e){}
  return '';
}

async function reprendreSession(){
  const rt = memoire('miel:session');
  if(!rt) return false;
  try{
    const r = await fetch(`${SB.url}/auth/v1/token?grant_type=refresh_token`, {
      method:'POST', headers:{apikey:SB.cle, 'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: rt})
    });
    if(!r.ok){ memoire('miel:session', null); return false; }
    const d = await r.json();
    if(!d.access_token) return false;
    jeton = d.access_token;
    if(d.refresh_token) memoire('miel:session', d.refresh_token);
    return true;
  }catch(e){ return false; }
}

// Mode d'envoi de la confirmation :
//   'edge'    → fonction Supabase, la clé du service reste côté serveur (recommandé)
//   'emailjs' → EmailJS, clé visible dans cette page
//   ''        → aucune confirmation envoyée
// Dans tous les cas, un échec d'envoi ne fait jamais échouer la commande.
const ENVOI = 'emailjs';

const MAIL = {
  service:  'service_s84tn09',     // Service ID  (EmailJS ▸ Email Services)
  modele:   'template_h1gc6es',    // Template ID (EmailJS ▸ Email Templates)
  cle:      'u027ja7OregFlZJRT',   // Public Key  (EmailJS ▸ Account)
  copie:    'greg@goemaere.com'    // votre copie de chaque commande
};

// Données communes aux deux modes d'envoi.
function recapMail(c){
  const pots = [];
  if(c.printemps) pots.push(c.printemps + ' pot' + (c.printemps>1?'s':'') + ' de printemps');
  if(c.ete)       pots.push(c.ete + ' pot' + (c.ete>1?'s':'') + " d'été");
  return {
    nom: c.nom, email: c.email, tel: c.tel,
    adresse: c.adresse + ', ' + c.ville,
    ville: c.ville,
    jour: joli(c.date), creneau: c.creneau,
    pots: pots.join(' et '), total: c.total + ' €',
    presence: c.presence, remarque: c.note || '',
    paiement: c.paiement === 'cash'
      ? 'en liquide ou par QR code à la livraison'
      : 'par virement avant la livraison' + (cfg.iban ? ' sur ' + cfg.iban : '')
  };
}

async function envoyerMail(c){
  if(!c.email || !ENVOI) return false;
  if(ENVOI === 'edge') return await envoyerViaEdge(c);
  return await envoyerViaEmailJS(c);
}

// La clé de l'expéditeur vit dans les secrets Supabase, pas ici.
async function envoyerViaEdge(c){
  try{
    const r = await fetch(`${SB.url}/functions/v1/confirmation`, {
      method:'POST',
      headers:{ apikey: SB.cle, Authorization: 'Bearer ' + SB.cle, 'Content-Type':'application/json' },
      body: JSON.stringify(recapMail(c))
    });
    if(!r.ok){ console.error('Confirmation refusée :', r.status, (await r.text()).slice(0,300)); return false; }
    return true;
  }catch(e){ console.error('Confirmation non envoyée :', e); return false; }
}

async function envoyerViaEmailJS(c){
  if(!MAIL.service || !MAIL.modele || !MAIL.cle) return false;
  const p = recapMail(c);
  try{
    const r = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        service_id: MAIL.service, template_id: MAIL.modele, user_id: MAIL.cle,
        template_params: {
          to_email:  p.email,      copie:     MAIL.copie,
          nom:       p.nom,        pots:      p.pots,
          total:     p.total,      jour:      p.jour,
          creneau:   p.creneau,    adresse:   p.adresse,
          telephone: p.tel,        presence:  p.presence,
          remarque:  p.remarque || '—',
          paiement:  p.paiement
        }
      })
    });
    return r.ok;
  }catch(e){ console.error('Confirmation non envoyée :', e); return false; }
}

const MODE = window.storage ? 'artefact' : 'web';
const S = window.storage || distant;
const app = document.getElementById('app');
const esc = s => String(s??'').replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

const DEFAULT_CFG = {
  prix: 12,
  stock: { printemps: 170, ete: 190 },
  iban: '',
  code: 'A-DEFINIR',
  tel: '',
  communes: ['Rhode-Saint-Genèse | 1640 Sint-Genesius-Rode','Waterloo | 1410 Waterloo'],
  maison: "Kerkeveldweg 103",
  communeMaison: 'Rhode-Saint-Genèse',
  jours: [3,6],              // mercredi, samedi
  semaines: 4,
  creneaux: ['10h — 13h','14h — 17h','17h — 20h'],
  creneauxParJour: {
    3: ['14h — 17h','17h — 20h'],
    6: ['10h — 13h','14h — 17h','17h — 20h']
  }
};

let cfg = {...DEFAULT_CFG};
let vendu = { printemps:0, ete:0 };
let panier = { printemps:0, ete:0 };
let form = { creneau:'', presence:'', paiement:'cash' };
let commandes = [];
let onglet = 'tournees';

/* ---------- stockage ---------- */
async function jget(k){ try{ const r = await S.get(k,true); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
async function jset(k,v){
  try{ await S.set(k, JSON.stringify(v), true); return true; }
  catch(e){ dernierEchec = e && e.message ? e.message : String(e); console.error('Écriture refusée :', dernierEchec); return false; }
}

async function chargerBase(){
  const c = await jget(KEY_CFG); if(c) cfg = {...DEFAULT_CFG, ...c};
  const v = await jget(KEY_CNT); if(v) vendu = {...vendu, ...v};
}
async function chargerCommandes(){
  let keys=[];
  try{ const r = await S.list(PFX,true); keys = (r && r.keys) || []; }catch(e){ keys=[]; }
  const out=[];
  for(let i=0;i<keys.length;i+=8){
    const lot = await Promise.all(keys.slice(i,i+8).map(k=>jget(k)));
    lot.forEach((o,j)=>{ if(o){ o._key = keys[i+j]; out.push(o); } });
  }
  commandes = out.sort((a,b)=> (a.date||'').localeCompare(b.date||'') || (a.cree||0)-(b.cree||0));
}

/* ---------- dates ---------- */
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function prochainesDates(){
  const out=[], d=new Date(); d.setHours(0,0,0,0);
  const fin=new Date(d); fin.setDate(fin.getDate()+cfg.semaines*7);
  d.setDate(d.getDate()+1);
  while(d<=fin){ if(cfg.jours.includes(d.getDay())) out.push(new Date(d)); d.setDate(d.getDate()+1); }
  return out;
}
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function creneauxJour(j){
  const m = cfg.creneauxParJour || {};
  return (m[j] && m[j].length) ? m[j] : (cfg.creneaux || []);
}
function creneauxDate(dateIso){
  return dateIso ? creneauxJour(new Date(dateIso+'T12:00:00').getDay()) : [];
}
function joli(s){
  const d=new Date(s+'T12:00:00');
  return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()];
}

/* ---------- étiquette ---------- */
function etiquetteSVG(){
  const cx=470, cy=288, r0=112, n=62;
  let rayons='';
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2;
    const len = 52 + 62*Math.abs(Math.sin(i*2.4)) ;
    const x1=cx+Math.cos(a)*r0, y1=cy+Math.sin(a)*r0;
    const x2=cx+Math.cos(a)*(r0+len), y2=cy+Math.sin(a)*(r0+len);
    rayons += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  }
  return `<svg class="label" viewBox="0 0 880 560" role="img" aria-label="Miel du Champ de l'Église, 500 g, pure honey">
    <g stroke="var(--or)" stroke-width="7" stroke-linecap="round">${rayons}</g>
    <g transform="rotate(-17 440 288)">
      <rect x="-30" y="196" width="940" height="176" fill="#fff"/>
      <text x="440" y="240" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="19"
        font-weight="500" letter-spacing="4.5" fill="#000">500 GR • 100% NATURAL</text>
      <text x="440" y="316" text-anchor="middle" font-family="'Archivo Black','Arial Black',sans-serif"
        font-size="76" fill="#000" textLength="830" lengthAdjust="spacingAndGlyphs">MIEL DU CHAMP DE L'EGLISE</text>
      <text x="440" y="356" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="20"

}

let optim = {};

// Les communes peuvent porter un alias de géocodage après une barre verticale,
// indispensable à Rhode-Saint-Genèse dont les rues sont enregistrées en néerlandais.
function nomCommune(x){ return String(x).split('|')[0].trim(); }
function geoCommune(nom){
  const e = (cfg.communes||[]).find(c => nomCommune(c) === nom);
  const alias = e && e.split('|')[1];
  return (alias || nom).trim();
}
const sansAccents = x => String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const cleGeo = adr => 'miel:geo3:' + sansAccents(adr).replace(/[^a-z0-9]+/g,'-').slice(0,140);

async function nominatim(q, commune){
  const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=1&countrycodes=be&q='+encodeURIComponent(q));
  const d = await r.json();
  if(!d || !d[0]) return null;
  const h = d[0];
  // refuser un centre de commune ou un code postal : ce n'est pas une adresse
  if(['city','town','village','municipality','postcode','administrative','suburb','state'].includes(h.addresstype)) return null;
  // refuser une rue trouvée dans une autre commune
  if(commune){
    const a = h.address || {}, ou = sansAccents([a.city,a.town,a.village,a.municipality,a.suburb,a.postcode,h.display_name].join(' '));
    const cible = sansAccents(commune).split(/[\s,]+/).filter(w=>w.length>3);
    if(cible.length && !cible.some(w=>ou.includes(w))) return null;
  }
  return {lat:+h.lat, lon:+h.lon};
}

async function geo(adr, commune){
  const k = cleGeo(adr + '|' + (commune||''));
  const c = await jget(k); if(c && c.lat) return c;
  const cible = commune ? geoCommune(commune) : '';
  const essais = commune
    ? [`${adr}, ${cible}, Belgique`, `${adr}, ${commune}, Belgique`]
    : [`${adr}, Belgique`];
  for(const q of essais){
    try{
      const pt = await nominatim(q, cible || commune);
      if(pt){ await jset(k, pt); return pt; }
    }catch(e){ /* réseau indisponible */ }
    await new Promise(r=>setTimeout(r,1100));
  }
  return null;
}

async function fixerPosition(adr, commune, lat, lon){
  await jset(cleGeo(adr + '|' + (commune||'')), {lat, lon});
}

// Accepte « 50.7448, 4.3606 » ou un lien Google Maps contenant @lat,lon
function lireCoord(txt){
  const m = String(txt).match(/(-?\d{1,2}[.,]\d{3,})[,\s/@]+(-?\d{1,2}[.,]\d{3,})/);
  if(!m) return null;
  const lat = parseFloat(m[1].replace(',','.')), lon = parseFloat(m[2].replace(',','.'));
  if(Math.abs(lat)>90 || Math.abs(lon)>180) return null;
  return {lat, lon};
}

function dist(a,b){
  if(!a||!b) return 9e9;
  const R=6371, t=x=>x*Math.PI/180;
  const dLat=t(b.lat-a.lat), dLon=t(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2 + Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

// Coût d'une chaîne d'arrêts entre un point d'entrée et un point de sortie imposés.
function coutChaine(l, entree, sortie){
  let d = 0, cur = entree;
  for(const c of l){ d += dist(cur, c._pt); cur = c._pt; }
  if(sortie) d += dist(cur, sortie);
  return d;
}

// Ordre optimal d'un groupe, entrée et sortie fixées.
// Jusqu'à 8 arrêts : toutes les permutations, donc l'optimum exact.
// Au-delà : 2-opt jusqu'à ce qu'aucune inversion n'améliore.
function meilleurOrdre(g, entree, sortie){
  if(g.length < 2) return g;
  if(g.length <= 8){
    let best = g, bc = Infinity;
    const perm = (reste, acc) => {
      if(!reste.length){
        const c = coutChaine(acc, entree, sortie);
        if(c < bc){ bc = c; best = acc.slice(); }
        return;
      }
      for(let i=0;i<reste.length;i++){
        const r = reste.slice(); const x = r.splice(i,1)[0];
        perm(r, acc.concat([x]));
      }
    };
    perm(g, []);
    return best;
  }
  let ordre = g.slice(), c0 = coutChaine(ordre, entree, sortie), tour = 0, mieux = true;
  while(mieux && tour++ < 80){
    mieux = false;
    for(let i=0;i<ordre.length-1;i++){
      for(let k=i+1;k<ordre.length;k++){
        const cand = ordre.slice(0,i).concat(ordre.slice(i,k+1).reverse(), ordre.slice(k+1));
        const c = coutChaine(cand, entree, sortie);
        if(c < c0 - 1e-9){ ordre = cand; c0 = c; mieux = true; }
      }
    }
  }
  return ordre;
}

// Tournée complète : maison → arrêts → maison.
// Les créneaux restent dans l'ordre horaire ; on n'optimise qu'à l'intérieur de chacun.
async function optimiser(liste, dateIso, progres){
  const maison = await geo(cfg.maison, cfg.communeMaison || nomCommune((cfg.communes||[''])[0]));
  let n = 0;
  for(const c of liste){
    if(!c._pt){
      c._pt = await geo(c.adresse, c.ville);
    }
    if(progres) progres(++n, liste.length);
  }
  const cj = creneauxDate(dateIso);
  const rang = c => { const i = cj.indexOf(c.creneau); return i<0 ? 99 : i; };
  const parRang = {};
  liste.forEach(c => { (parRang[rang(c)] ||= []).push(c); });

  const cles = Object.keys(parRang).sort((a,b)=>a-b);
  const situes = cles.map(k => parRang[k].filter(c=>c._pt));
  const perdus = cles.map(k => parRang[k].filter(c=>!c._pt));

  // Première passe : sortie connue seulement pour le dernier groupe (retour maison).
  let cur = maison;
  for(let i=0;i<situes.length;i++){
    situes[i] = meilleurOrdre(situes[i], cur, i===situes.length-1 ? maison : null);
    if(situes[i].length) cur = situes[i][situes[i].length-1]._pt;
  }
  // Passes suivantes : chaque groupe connaît maintenant le point d'entrée du suivant.
  for(let passe=0; passe<2; passe++){
    cur = maison;
    for(let i=0;i<situes.length;i++){
      const suiv = situes.slice(i+1).find(g=>g.length);
      situes[i] = meilleurOrdre(situes[i], cur, suiv ? suiv[0]._pt : maison);
      if(situes[i].length) cur = situes[i][situes[i].length-1]._pt;
    }
  }

  const sortie = [];
  situes.forEach((g,i)=> sortie.push(...g, ...perdus[i]));
  sortie.km = maison ? Math.round(coutChaine(sortie.filter(c=>c._pt), maison, maison)) : 0;
  return sortie;
}

function maisonComplete(){
  const cm = cfg.communeMaison ? ', ' + geoCommune(cfg.communeMaison) : '';
  return cfg.maison + cm;
}

function urlMaps(ordre){
  const pts = ordre.map(c=>`${c.adresse}, ${c.ville||''}`).slice(0,9);
  const m = encodeURIComponent(maisonComplete());
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+m+'&destination='+m
    + (pts.length ? '&waypoints='+pts.map(encodeURIComponent).join('%7C') : '');
}

  const verifier = async v => {
    if(MODE === 'artefact') return v === cfg.code;
    const m = document.getElementById('mail');
    return await distant.connexion(v, m ? m.value.trim() : '');
  };
  const go = async () => {
    const rester = document.getElementById('rester');
    if(await verifier(document.getElementById('code').value.trim())){
      if(rester && !rester.checked) memoire('miel:session', null);
      app.innerHTML = '<div class="wrap"><p class="empty">Chargement des commandes…</p></div>';
      await chargerCommandes(); vueAdmin();
    } else {
      const e2 = document.getElementById('e2');
      e2.hidden = false;
      e2.innerHTML = 'Identifiants refusés, ou base inaccessible.'
        + (dernierEchec ? '<br><small style="color:var(--ink-soft)">' + esc(dernierEchec) + '</small>' : '');
    }
  };
  document.getElementById('ok').onclick = go;
  document.getElementById('code').onkeydown = e => { if(e.key==='Enter') go(); };
}

        style="flex:1;min-width:190px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:.85rem">

function brancherActions(){
  app.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{
    const [act,id]=b.dataset.act.split(',');
    const c=commandes.find(x=>x.id===id); if(!c) return;
    if(act==='livree') c.statut = c.statut==='livree' ? 'a_livrer' : 'livree';
    if(act==='paye') c.paye = !c.paye;
    if(act==='pos'){
      const z=document.getElementById('pos-'+id);
      z.hidden=!z.hidden;
      if(!z.hidden) document.getElementById('in-'+id).focus();
      return;
    }
    if(act==='suppr'){
      // confirmation en deux clics : les boîtes de dialogue du navigateur sont bloquées ici
      if(b.dataset.sur !== '1'){
        b.dataset.sur='1'; b.textContent='Confirmer ?'; b.style.background='var(--alert)';
        b.style.borderColor='var(--alert)'; b.style.color='#fff';
        clearTimeout(b._t);
        b._t = setTimeout(()=>{ b.dataset.sur='0'; b.textContent='Annuler'; b.style.cssText=''; }, 5000);
        return;
      }
      c.statut = 'annulee';
      const cnt = await jget(KEY_CNT) || {printemps:0, ete:0};
      await jset(KEY_CNT, {printemps:Math.max(0,cnt.printemps-c.printemps), ete:Math.max(0,cnt.ete-c.ete)});
      delete optim[c.date];
    }
    if(act==='remettre'){ 
      c.statut = 'a_livrer';
      const cnt = await jget(KEY_CNT) || {printemps:0, ete:0};
      await jset(KEY_CNT, {printemps:(cnt.printemps||0)+c.printemps, ete:(cnt.ete||0)+c.ete});
    }
    b.disabled = true; b.textContent = '…';
    const ok = await jset(c._key || PFX+c.id, c);
    if(!ok){ b.disabled=false; b.textContent='Échec, réessayez'; return; }
    vueAdmin();
  });
}

function brancherPositions(){
  app.querySelectorAll('[data-pos]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.pos, c=commandes.find(x=>x.id===id); if(!c) return;
    const pt = lireCoord(document.getElementById('in-'+id).value);
    if(!pt){ b.textContent='Coordonnées illisibles'; setTimeout(()=>b.textContent='Enregistrer',2200); return; }
    await fixerPosition(c.adresse, c.ville, pt.lat, pt.lon);
    c._pt = pt;
    delete optim[c.date];
    vueAdmin();
  });
}

function renduTournees(){
  const z=document.getElementById('zone');
  const actives = commandes.filter(c=>c.statut!=='annulee');
  const parJour = {};
  actives.forEach(c=>{ (parJour[c.date] ||= []).push(c); });
  const jours = Object.keys(parJour).sort();
  if(!jours.length){ z.innerHTML='<p class="empty">Aucune commande pour l\'instant. Partagez le lien sur le groupe des voisins.</p>'; return; }

  const trier = j => {
    const cj = creneauxDate(j), o = optim[j];
    const rang = c => { const i = cj.indexOf(c.creneau); return i<0 ? 99 : i; };
    const pos  = c => o ? (o.indexOf(c.id)+1 || 99) : 0;
    return [...parJour[j]].sort((a,b)=> rang(a)-rang(b) || pos(a)-pos(b));
  };

  z.innerHTML = jours.map(j=>{
    const l = parJour[j], tri = trier(j);
    const pp   = l.reduce((s,c)=>s+c.printemps,0);
    const pe   = l.reduce((s,c)=>s+c.ete,0);
    const cash = l.filter(c=>c.paiement==='cash'&&!c.paye).reduce((s,c)=>s+c.total,0);
    let dernier=null, html='', n=0;
    tri.forEach(c=>{
      if(c.creneau!==dernier){ html += `<div class="slot">${esc(c.creneau)}</div>`; dernier=c.creneau; }
      html += carte(c, c.statut==='livree' ? null : ++n);
    });
    return `<div class="tournee">
      <h3><span>${joli(j)}</span><span>${l.length} arrêt${l.length>1?'s':''} · ${cash} € en liquide</span></h3>
      <div class="charge">
        <span><b>${pp}</b> printemps</span>
        <span><b>${pe}</b> été</span>
        <span><b>${pp+pe}</b> pots à charger</span>
      </div>
      ${html}
      <div class="acts">
        <button data-copie="${j}">Copier la liste pour Gabriel</button>
        <button data-iti="${j}">Itinéraire le plus court</button>
        <button onclick="window.print()">Imprimer</button>
      </div>
      <p class="err" id="st-${j}" hidden></p>
    </div>`;
  }).join('');

  brancherActions();
  brancherPositions();

  z.querySelectorAll('[data-copie]').forEach(b=>b.onclick=()=>{
    const j=b.dataset.copie;
    const l = trier(j).filter(c=>c.statut!=='livree');
    const txt = 'Tournée du '+joli(j)+' — départ et retour : '+maisonComplete()+'\n\n' + l.map((c,i)=>
      `${i+1}. ${c.creneau} — ${c.nom}\n${c.adresse}, ${c.ville}\n${c.tel}\n`
      + `${c.printemps?c.printemps+' printemps  ':''}${c.ete?c.ete+' été':''}\n`
      + `${c.total} € ${c.paiement==='cash'&&!c.paye?'(à encaisser)':'(déjà réglé)'}\n`
      + `${c.presence}${c.note?' — '+c.note:''}`).join('\n\n');
    navigator.clipboard.writeText(txt).then(()=>{
      b.textContent='Copié ✓'; setTimeout(()=>b.textContent='Copier la liste pour Gabriel',1800);
    });
  });

  z.querySelectorAll('[data-iti]').forEach(b=>b.onclick=async()=>{
    const j = b.dataset.iti;
    const l = trier(j).filter(c=>c.statut!=='livree');
    const st = document.getElementById('st-'+j);
    if(!l.length){ st.hidden=false; st.textContent='Tout est déjà livré ce jour-là.'; return; }
    const w = window.open('', '_blank');
    if(w) w.document.write('<p style="font:16px system-ui;padding:24px">Calcul de la tournée…</p>');
    b.disabled = true;
    const ordre = await optimiser(l, j, (k,t)=>{ b.textContent = `Localisation ${k}/${t}…`; });
    const situes = ordre.filter(c=>c._pt).length;
    optim[j] = ordre.map(c=>c.id);
    const url = urlMaps(ordre);
    if(w) w.location.href = url; else window.open(url,'_blank');
    renduTournees();
    const st2 = document.getElementById('st-'+j);
    if(st2){
      st2.hidden = false;
      st2.style.color = situes ? 'var(--ok)' : 'var(--alert)';
      const rates = ordre.filter(c=>!c._pt).map(c=>c.nom);
      st2.style.color = rates.length ? 'var(--alert)' : 'var(--ok)';
      st2.textContent = situes
        ? `Tournée réordonnée : ${ordre.km} km à vol d'oiseau, départ et retour au ${maisonComplete()}.`
          + (ordre.length>9 ? ' Google Maps ne garde que les 9 premiers arrêts.' : '')
          + (rates.length ? ` Non localisé : ${rates.join(', ')} — utilisez le bouton Position.` : '')
        : "Aucune adresse localisée. Corrigez les positions à la main, ou vérifiez l'alias de commune dans les réglages.";
    }
  });
}

function renduStats(){
  const z = document.getElementById('zone');
  const l = commandes.filter(c => c.statut !== 'annulee');
  if(!l.length){ z.innerHTML = '<p class="empty">Rien à mesurer tant qu\'aucune commande n\'est arrivée.</p>'; return; }

  const somme = (t, f) => t.reduce((s,c)=>s+f(c), 0);
  const vp = somme(l, c=>c.printemps), ve = somme(l, c=>c.ete);
  const ca = somme(l, c=>c.total);
  const encaisse = somme(l.filter(c=>c.paye), c=>c.total);
  const livrees  = l.filter(c=>c.statut==='livree').length;
  const panier   = Math.round(ca / l.length);
  const potsRestants = restant('printemps') + restant('ete');
  const valeurStock  = potsRestants * cfg.prix;

  const jauge = (titre, vendu, total, couleur) => {
    const pct = total ? Math.min(100, Math.round(vendu/total*100)) : 0;
    return `<div class="jauge">
      <div class="l"><span>${titre}</span><em>${vendu} / ${total} pots · ${pct} %</em></div>
      <div class="piste"><i style="width:${pct}%;background:${couleur}"></i></div>
    </div>`;
  };

  const classement = (titre, map) => {
    const e = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8);
    if(!e.length) return '';
    const max = e[0][1];
    return `<div class="reglage"><h3>${titre}</h3>
      ${e.map(([k,v])=>`<div class="rang">
        <span class="n">${esc(k)}</span>
        <span class="p"><i style="width:${Math.round(v/max*100)}%"></i></span>
        <span class="v">${v}</span></div>`).join('')}</div>`;
  };

  const compter = f => l.reduce((m,c)=>{ const k=f(c)||'—'; m[k]=(m[k]||0)+1; return m; }, {});
  const potsPar = f => l.reduce((m,c)=>{ const k=f(c)||'—'; m[k]=(m[k]||0)+c.printemps+c.ete; return m; }, {});

  const semaine = c => {
    const d = new Date(c.date + 'T12:00:00');
    const lundi = new Date(d); lundi.setDate(d.getDate() - ((d.getDay()+6)%7));
    return 'sem. du ' + lundi.getDate() + ' ' + MOIS[lundi.getMonth()].slice(0,4) + '.';
  };

  z.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${vp+ve}</b><span>pots commandés</span></div>
      <div class="stat"><b>${ca} €</b><span>chiffre d'affaires</span></div>
      <div class="stat"><b>${encaisse} €</b><span>déjà encaissé</span></div>
      <div class="stat"><b>${l.length}</b><span>commandes</span></div>
      <div class="stat"><b>${panier} €</b><span>panier moyen</span></div>
      <div class="stat"><b>${livrees}</b><span>livrées</span></div>
    </div>

    <div class="reglage">
      <h3>Écoulement de la récolte</h3>
      ${jauge('Printemps', vp, cfg.stock.printemps, 'var(--printemps)')}
      ${jauge('Été', ve, cfg.stock.ete, 'var(--ete)')}
      <p style="margin:0"><small>Il reste ${potsRestants} pots, soit ${valeurStock} € de stock à vendre.</small></p>
    </div>

    ${classement('Pots par commune', potsPar(c=>c.ville))}
    ${classement('Commandes par semaine de livraison', compter(semaine))}
    ${classement('Créneaux les plus demandés', compter(c=>c.creneau))}
    ${classement('Consigne en cas d\'absence', compter(c=>c.presence))}

    <div class="reglage">
      <h3>Paiement</h3>
      <div class="rang"><span class="n">Liquide / QR</span>
        <span class="p"><i style="width:${Math.round(l.filter(c=>c.paiement==='cash').length/l.length*100)}%"></i></span>
        <span class="v">${l.filter(c=>c.paiement==='cash').length}</span></div>
      <div class="rang"><span class="n">Virement</span>
        <span class="p"><i style="width:${Math.round(l.filter(c=>c.paiement!=='cash').length/l.length*100)}%"></i></span>
        <span class="v">${l.filter(c=>c.paiement!=='cash').length}</span></div>
      <p style="margin:.6rem 0 0"><small>${ca - encaisse} € restent à encaisser.</small></p>
    </div>`;
}

    });
    cfg.creneauxParJour = par;
    const cm = document.getElementById('cm').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(cm.length) cfg.communes = cm;
    cfg.maison = document.getElementById('ma').value.trim() || cfg.maison;
    cfg.communeMaison = document.getElementById('mc').value.trim();
    await jset(KEY_CFG, cfg);
    const m=document.getElementById('okmsg'); m.hidden=false; setTimeout(()=>m.hidden=true,2500);
  };
}

/* ---------- démarrage ---------- */
(async()=>{ await chargerBase(); vuePublique(); })();
